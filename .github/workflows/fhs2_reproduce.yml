name: Reproduce FHS2 SPY evidence
on:
  push:
    branches: ['research/fhs2-factorial-2026-10-30']
    paths: ['.github/workflows/fhs2_reproduce.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install recorded numerical versions
        run: python -m pip install -e '.[dev]' numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 arch==8.0.0 statsmodels==0.14.6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: path-research-input
          run-id: 41033349796
          github-token: ${{ github.token }}
          path: inputs
      - name: Verify original data and test implementation
        run: |
          echo '264ff7216c975000c8ffb8be3fd45a79d37d9642d22c05a1b63f68742e0428c6  inputs/input.csv' | sha256sum -c -
          mkdir -p outputs
          python -m pytest -q | tee outputs/tests.txt
      - name: Replay all matured horizons with the fixed experiment
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m synthetic_market.research2 evaluate --csv inputs/input.csv --metadata inputs/input_metadata.json --price-basis adjusted --out outputs/SPY
          python examples/audit_fhs2.py --results outputs/SPY --input inputs/input.csv --out outputs/referee.json
          python examples/replay_fhs2.py --csv inputs/input.csv --results outputs/SPY --out outputs/score_replay.json
          python -m pip freeze > outputs/environment.txt
          git archive HEAD -o outputs/source.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fhs2-spy-evidence
          path: outputs
          retention-days: 30
