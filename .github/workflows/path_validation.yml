name: Reproducible SPY path research
on:
  push:
    branches: ["research/path-validation-2026-10-30"]
    paths: [".github/workflows/path_validation.yml"]
  workflow_dispatch:
    inputs:
      snapshot_run_id:
        description: "Run containing the preserved path-research-input artifact (fails if expired)"
        required: true
        default: "41033349796"
permissions:
  contents: read
  actions: read
jobs:
  path-study:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Install recorded research dependency versions
        run: python -m pip install -e '.[dev]' numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 arch==8.0.0 statsmodels==0.14.6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: path-research-input
          path: research-input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.snapshot_run_id || '41033349796' }}
      - name: Verify original input and reviewed scientific implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          assert sha256(Path('research-input/input.csv').read_bytes()).hexdigest() == '264ff7216c975000c8ffb8be3fd45a79d37d9642d22c05a1b63f68742e0428c6'
          assert sha256(Path('src/synthetic_market/path_validation.py').read_bytes()).hexdigest() == '0990df6a03d1c438239f18eeda46c2c7df3e3313c46ac2835b084d4814911f42'
          PY
      - run: python -m pytest -q
      - name: Complete path comparison with locked protocol
        run: |
          python -m synthetic_market.path_validation --csv research-input/input.csv --metadata research-input/input_metadata.json --price-basis adjusted --out outputs/spy-paths
          python examples/audit_path_study.py --results outputs/spy-paths --input research-input/input.csv --out outputs/path-referee.json
          python -m pip freeze > outputs/research-environment.txt
      - name: Print calibration and comparator results, including failures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('outputs/spy-paths/path_summary.json').read_text())
          for row in result['aggregate']:
              print(json.dumps({k:row[k] for k in ['method','horizon','origins','max_drawdown_crps','max_drawdown_coverage90','drawdown_q95_breach_peak_dates','recovery_prob','recovery_actual']}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spy-path-evidence
          path: outputs/
          retention-days: 90
          if-no-files-found: error
