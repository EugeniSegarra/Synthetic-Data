name: Tests and offline integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install supported dependencies
        run: python -m pip install -e '.[yahoo,dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Numerical, adversarial and integration tests
        run: python -m pytest -q
      - name: Installed command offline example
        run: synthetic-market demo --observations 500 --paths 8 --horizon 5 --out outputs/ci-demo
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate wheel installation
        shell: bash
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/python -m synthetic_market demo --observations 500 --paths 4 --horizon 3 --out /tmp/installed-wheel-demo
          /tmp/wheel-check/bin/python - <<'PY'
          from synthetic_market.data import MarketData, make_demo_data, write_csv
          d = make_demo_data(n_obs=700)
          write_csv(MarketData(d.close.iloc[:, :1], metadata=d.metadata), '/tmp/installed-research-input.csv')
          PY
          /tmp/wheel-check/bin/python -m synthetic_market.research2 issue --csv /tmp/installed-research-input.csv --price-basis adjusted --train-window 500 --paths 50 --out /tmp/installed-research-issue
          /tmp/wheel-check/bin/python - <<'PY'
          import json
          from pathlib import Path
          import synthetic_market.research2 as module
          assert '/tmp/wheel-check/' in str(Path(module.__file__).resolve())
          result = json.loads(Path('/tmp/installed-research-issue/issuance.json').read_text())
          assert result['status'] == 'unscored_snapshot_not_proof_of_prospective_issuance'
          PY
