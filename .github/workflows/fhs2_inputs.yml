name: FHS2 research input capture
on:
  push:
    branches: ['research/fhs2-factorial-2026-10-30']
    paths: ['.github/workflows/fhs2_inputs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[yahoo,dev]'
      - name: Capture separate histories without filling or substituting data
        run: |
          mkdir -p outputs/fhs2-inputs
          python - <<'PY'
          import json
          from pathlib import Path
          from synthetic_market.data import download_yahoo, write_csv
          out=Path('outputs/fhs2-inputs')
          status={}
          for symbol in ['EWJ','EEM','VGK','^VIX','^VIX3M','^IRX']:
              key=symbol.replace('^','')
              try:
                  data=download_yahoo([symbol], '1993-01-01','2026-10-30')
                  write_csv(data,out/f'{key}.csv')
                  (out/f'{key}_metadata.json').write_text(json.dumps(data.metadata,indent=2))
                  status[symbol]={'rows':len(data.close),'start':str(data.close.index[0].date()),'end':str(data.close.index[-1].date()),'data_sha256':data.fingerprint()}
              except Exception as exc:
                  status[symbol]={'error':f'{type(exc).__name__}: {exc}'}
          (out/'acquisition_status.json').write_text(json.dumps(status,indent=2))
          print(json.dumps(status,indent=2))
          PY
          git archive HEAD -o outputs/fhs2-inputs/source.tar
          python -m pip freeze > outputs/fhs2-inputs/environment.txt
          python -m pip download --only-binary=:all: --dest outputs/fhs2-inputs/wheels build wheel setuptools packaging pyproject-hooks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fhs2-research-inputs
          path: outputs/fhs2-inputs
          retention-days: 1
