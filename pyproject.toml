[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-market-scenarios"
version = "1.0.0"
description = "Auditable multivariate financial scenarios with filtered historical simulation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Eugeni Segarra"}]
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scipy>=1.12,<2", "arch>=7.2,<9"]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.54,<2"]
plots = ["matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
synthetic-market = "synthetic_market.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
